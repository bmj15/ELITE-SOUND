<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
</head>
<body>
  <div class="container">
    <h2>Entrar</h2>
    <form id="login-form">
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>
      
      <label for="password">Senha:</label>
      <input type="password" id="password" name="password" required>
      
      <button type="submit">Entrar</button>
    </form>
    <div id="login-message"></div>
    <p>Ainda não tem conta? <a href="register.html">Cadastre-se</a></p>
  </div>
  
  <script>
    const API_BASE = '/api';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch(`${API_BASE}/users/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if(response.ok) {
          // Armazena o token e redireciona para o dashboard ou área do cliente
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          document.getElementById('login-message').textContent = data.error || 'Erro ao efetuar login';
        }
      } catch (error) {
        document.getElementById('login-message').textContent = 'Erro na comunicação com o servidor.';
      }
    });
  </script>
</body>
</html>
