<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservar Equipamento - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
</head>
<body>
  <div class="container">
    <h2>Reserva de Equipamento</h2>
    <div id="equipment-details">
      <!-- Dados do equipamento serão exibidos aqui -->
    </div>
    <form id="order-form">
      <label for="pickup_date">Data de Levantamento:</label>
      <input type="datetime-local" id="pickup_date" name="pickup_date" required>

      <label for="return_date">Data de Devolução:</label>
      <input type="datetime-local" id="return_date" name="return_date" required>
      
      <label for="coupon_code">Cupão de desconto (opcional):</label>
      <input type="text" id="coupon_code" name="coupon_code">

      <label for="notes">Observações:</label>
      <textarea id="notes" name="notes"></textarea>
      
      <button type="submit">Confirmar Reserva</button>
    </form>
    <div id="order-message"></div>
  </div>
  
  <script>
    const API_BASE = '/api';

    // Função para obter parâmetro da URL
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const equipmentId = getQueryParam('equipmentId');

    // Carregar os dados do equipamento
    async function loadEquipment() {
      try {
        const response = await fetch(`${API_BASE}/equipments/${equipmentId}`);
        if(!response.ok) throw new Error('Erro ao carregar equipamento');
        const equipment = await response.json();
        renderEquipment(equipment);
      } catch (error) {
        document.getElementById('equipment-details').innerHTML = '<p>Não foi possível carregar os detalhes do equipamento.</p>';
      }
    }

    function renderEquipment(equipment) {
      const detailsDiv = document.getElementById('equipment-details');
      detailsDiv.innerHTML = `
        <h3>${equipment.name}</h3>
        <p>${equipment.description}</p>
        <p><strong>Preço por dia:</strong> €${equipment.price_day}</p>
      `;
    }

    // Enviar pedido de reserva
    document.getElementById('order-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const pickup_date = document.getElementById('pickup_date').value;
      const return_date = document.getElementById('return_date').value;
      const notes = document.getElementById('notes').value;
      const coupon_code = document.getElementById('coupon_code').value;
      if (!localStorage.getItem('token')) {
        window.location.href = 'login.html';
        return;
      }
      
      // Monta o objeto de pedido
      // O cliente e o valor são definidos pelo servidor
      const orderData = { equipment_id: equipmentId, pickup_date, return_date, notes, coupon_code };
      
      try {
        const response = await fetch(`${API_BASE}/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        
        const data = await response.json();
        if(response.ok) {
          document.getElementById('order-message').innerHTML = `Reserva n.º ${data.order.id} efetuada! Valor: €${data.order.total_value}. <a href="order_contract.html?orderId=${data.order.id}">Ver e assinar o contrato</a>`;
          // Opcional: redirecionar para página de acompanhamento do pedido
        } else {
          document.getElementById('order-message').textContent = data.error || 'Erro ao efetuar reserva.';
        }
      } catch (error) {
        document.getElementById('order-message').textContent = 'Erro na comunicação com o servidor.';
      }
    });

    // Inicia carregamento dos dados do equipamento
    if(equipmentId) {
      loadEquipment();
    } else {
      document.getElementById('equipment-details').innerHTML = '<p>ID de equipamento não especificado.</p>';
    }
  </script>
</body>
</html>
