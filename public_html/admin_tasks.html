<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarefas Internas - Painel de Controle</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #fff;
    }
    .task-card {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 3px;
      background-color: #f4f4f4;
    }
    .task-card p {
      margin: 5px 0;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #007bff;
      border: none;
      color: #fff;
      border-radius: 3px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Painel de Controle - Tarefas Internas</h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="#" id="logout">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <div class="container">
    <h2>Lista de Tarefas</h2>
    <div id="tasks-list">
      <!-- As tarefas serão listadas aqui -->
    </div>
    <hr>
    <h3>Criar Nova Tarefa</h3>
    <form id="task-form">
      <label for="title">Título:</label>
      <input type="text" id="title" required>
      
      <label for="description">Descrição:</label>
      <textarea id="description" required></textarea>
      
      <label for="assigned_to">ID do Colaborador (assigned_to):</label>
      <input type="number" id="assigned_to" required>
      
      <label for="due_date">Data de Vencimento:</label>
      <input type="datetime-local" id="due_date" required>
      
      <label for="priority">Prioridade (0-10):</label>
      <input type="number" id="priority" min="0" max="10">
      
      <button type="submit">Criar Tarefa</button>
    </form>
    <div id="task-message"></div>
  </div>
  
  <script>
    const API_BASE = 'http://localhost:5000/api';

    // Função para carregar as tarefas
    async function loadTasks() {
      try {
        const response = await fetch(`${API_BASE}/tasks`);
        if (!response.ok) throw new Error('Erro ao carregar tarefas');
        const tasks = await response.json();
        renderTasks(tasks);
      } catch (error) {
        document.getElementById('tasks-list').innerHTML = `<p>${error.message}</p>`;
      }
    }

    // Função para renderizar as tarefas na página
    function renderTasks(tasks) {
      const listDiv = document.getElementById('tasks-list');
      listDiv.innerHTML = '';
      if (tasks.length === 0) {
        listDiv.innerHTML = '<p>Nenhuma tarefa encontrada.</p>';
        return;
      }
      tasks.forEach(task => {
        const card = document.createElement('div');
        card.className = 'task-card';
        card.innerHTML = `
          <p><strong>ID:</strong> ${task.id}</p>
          <p><strong>Título:</strong> ${task.title}</p>
          <p><strong>Descrição:</strong> ${task.description}</p>
          <p><strong>Vencimento:</strong> ${new Date(task.due_date).toLocaleString()}</p>
          <p><strong>Prioridade:</strong> ${task.priority}</p>
          <p><strong>Status:</strong> ${task.status}</p>
          <hr>
        `;
        listDiv.appendChild(card);
      });
    }

    // Evento para criação de uma nova tarefa
    document.getElementById('task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const assigned_to = document.getElementById('assigned_to').value;
      const due_date = document.getElementById('due_date').value;
      const priority = document.getElementById('priority').value;

      try {
        const response = await fetch(`${API_BASE}/tasks/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, assigned_to, due_date, priority })
        });
        const data = await response.json();
        if (response.ok) {
          document.getElementById('task-message').textContent = data.message;
          document.getElementById('task-form').reset();
          loadTasks();
        } else {
          document.getElementById('task-message').textContent = data.error || 'Erro ao criar tarefa.';
        }
      } catch (error) {
        document.getElementById('task-message').textContent = 'Erro na comunicação com o servidor.';
      }
    });

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    document.addEventListener('DOMContentLoaded', loadTasks);
  </script>
</body>
</html>
