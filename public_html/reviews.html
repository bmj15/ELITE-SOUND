<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Avaliações - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .review-card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 3px; background-color: #f9f9f9; }
  </style>
  <script src="js/api.js"></script>
</head>
<body>
  <div class="container">
    <h1>Avaliações</h1>
    <div id="reviews-list"></div>
    <hr>
    <h3>Adicionar Avaliação</h3>
    <form id="review-form">
      <label for="order_id">ID do Pedido:</label>
      <input type="number" id="order_id" required>
      <label for="client_id">ID do Cliente:</label>
      <input type="number" id="client_id" required>
      <label for="rating">Nota (1-5):</label>
      <input type="number" id="rating" min="1" max="5" required>
      <label for="comment">Comentário:</label>
      <textarea id="comment" required></textarea>
      <button type="submit">Enviar Avaliação</button>
    </form>
    <div id="review-message"></div>
  </div>
  
  <script>
    const API_BASE = '/api/reviews';

    async function loadReviews() {
      try {
        const res = await fetch(API_BASE);
        const reviews = await res.json();
        let html = '';
        if (reviews.length === 0) html = '<p>Nenhuma avaliação encontrada.</p>';
        reviews.forEach(review => {
          html += `<div class="review-card">
            <p><strong>ID do Pedido:</strong> ${review.order_id}</p>
            <p><strong>Nota:</strong> ${review.rating}</p>
            <p><strong>Comentário:</strong> ${review.comment}</p>
            <p><em>Criado em: ${new Date(review.created_at).toLocaleString()}</em></p>
          </div>`;
        });
        document.getElementById('reviews-list').innerHTML = html;
      } catch (error) {
        document.getElementById('reviews-list').textContent = 'Erro ao carregar avaliações.';
      }
    }

    document.getElementById('review-form').addEventListener('submit', async e => {
      e.preventDefault();
      const order_id = document.getElementById('order_id').value;
      const client_id = document.getElementById('client_id').value;
      const rating = document.getElementById('rating').value;
      const comment = document.getElementById('comment').value;

      try {
        const res = await fetch(`${API_BASE}/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order_id, client_id, rating, comment })
        });
        const data = await res.json();
        document.getElementById('review-message').textContent = data.message || data.error;
        loadReviews();
        e.target.reset();
      } catch (error) {
        document.getElementById('review-message').textContent = 'Erro na comunicação com o servidor.';
      }
    });

    document.addEventListener('DOMContentLoaded', loadReviews);
  </script>
</body>
</html>
