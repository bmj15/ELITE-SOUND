<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code de Levantamento - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      text-align: center;
    }
    img {
      margin-top: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>QR Code para Levantamento do Pedido</h2>
    <p>Este QR Code contém um link para o levantamento do seu pedido.</p>
    <div id="qr-code-container">
      <!-- O QR Code será exibido aqui -->
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api';

    // Função para obter o parâmetro orderId da URL
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const orderId = getQueryParam('orderId');
    if (!orderId) {
      document.getElementById('qr-code-container').innerHTML = '<p>ID do pedido não especificado.</p>';
    } else {
      // Chama o endpoint para gerar o QR Code
      fetch(`${API_BASE}/qrcode/generate?orderId=${orderId}`)
        .then(response => response.json())
        .then(data => {
          if (data.qrDataUrl) {
            const img = document.createElement('img');
            img.src = data.qrDataUrl;
            img.alt = 'QR Code de Levantamento';
            document.getElementById('qr-code-container').appendChild(img);
          } else {
            document.getElementById('qr-code-container').innerHTML = '<p>Não foi possível gerar o QR Code.</p>';
          }
        })
        .catch(error => {
          document.getElementById('qr-code-container').innerHTML = `<p>Erro: ${error.message}</p>`;
        });
    }
  </script>
</body>
</html>
