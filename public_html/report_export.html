<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exportar Relatório Mensal - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #fff;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      border: none;
      color: #fff;
      border-radius: 3px;
      cursor: pointer;
      font-size: 1em;
    }
  </style>
  <script src="js/api.js"></script>
</head>
<body>
  <div class="container">
    <h2>Exportar Relatório Mensal</h2>
    <p>Clique no botão abaixo para exportar o relatório em formato Excel.</p>
    <button id="export-btn">Exportar Relatório</button>
    <div id="export-message"></div>
  </div>
  
  <script>
    const API_BASE = '/api';

    document.getElementById('export-btn').addEventListener('click', async () => {
      try {
        const response = await fetch(`${API_BASE}/reports/monthly`, { method: 'GET' });
        if (!response.ok) throw new Error('Erro ao exportar relatório');
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'relatorio_mensal.xlsx';
        document.body.appendChild(a);
        a.click();
        a.remove();
        document.getElementById('export-message').textContent = 'Relatório exportado com sucesso!';
      } catch (error) {
        document.getElementById('export-message').textContent = error.message;
      }
    });
  </script>
</body>
</html>
