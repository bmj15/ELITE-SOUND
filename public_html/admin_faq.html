<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAQ Interno - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .faq-item { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Elite Sound - FAQ Interno</h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="admin_tasks.html">Tarefas Internas</a></li>
          <li><a href="#" id="logout">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <div class="container">
    <h2>Perguntas Frequentes (FAQ)</h2>
    <div id="faq-list">
      <!-- FAQs serão carregadas aqui -->
    </div>
    <hr>
    <h3>Adicionar Nova FAQ</h3>
    <form id="faq-form">
      <label for="question">Pergunta:</label>
      <textarea id="question" required></textarea>
      <label for="answer">Resposta:</label>
      <textarea id="answer" required></textarea>
      <button type="submit">Adicionar FAQ</button>
    </form>
    <div id="faq-message"></div>
  </div>
  
  <script>
    const API_BASE = 'http://localhost:5000/api';
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
    }

    async function loadFAQs() {
      try {
        const response = await fetch(`${API_BASE}/faqs`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Erro ao carregar FAQs');
        const faqs = await response.json();
        renderFAQs(faqs);
      } catch (error) {
        document.getElementById('faq-list').innerHTML = '<p>Não foi possível carregar as FAQs.</p>';
      }
    }
    
    function renderFAQs(faqs) {
      const list = document.getElementById('faq-list');
      list.innerHTML = '';
      if (faqs.length === 0) {
        list.innerHTML = '<p>Nenhuma FAQ disponível.</p>';
        return;
      }
      faqs.forEach(faq => {
        const faqDiv = document.createElement('div');
        faqDiv.className = 'faq-item';
        faqDiv.innerHTML = `
          <p><strong>Pergunta:</strong> ${faq.question}</p>
          <p><strong>Resposta:</strong> ${faq.answer}</p>
          <hr>
        `;
        list.appendChild(faqDiv);
      });
    }
    
    document.getElementById('faq-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('question').value;
      const answer = document.getElementById('answer').value;
      try {
        const response = await fetch(`${API_BASE}/faqs`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ question, answer })
        });
        const data = await response.json();
        if (response.ok) {
          document.getElementById('faq-message').textContent = 'FAQ adicionada com sucesso!';
          document.getElementById('faq-form').reset();
          loadFAQs();
        } else {
          document.getElementById('faq-message').textContent = data.error || 'Erro ao adicionar FAQ.';
        }
      } catch (error) {
        document.getElementById('faq-message').textContent = 'Erro na comunicação com o servidor.';
      }
    });
    
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });
    
    document.addEventListener('DOMContentLoaded', loadFAQs);
  </script>
</body>
</html>
