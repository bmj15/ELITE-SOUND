<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Detalhes do Equipamento - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .recommendation { border: 1px solid #ccc; padding: 8px; margin: 10px; border-radius: 4px; background-color: #f9f9f9; }
  </style>
  <script src="js/api.js"></script>
</head>
<body>
  <!-- Conteúdo principal do equipamento -->
  <div class="container">
    <h1>Detalhes do Equipamento</h1>
    <!-- Dados do equipamento aqui -->

    <h3>Equipamentos Relacionados</h3>
    <div id="recommendations"></div>
  </div>

  <script>
    const API_BASE = '/api/recommendations';
    
    // Suponha que o ID do equipamento atual esteja disponível, por exemplo, via URL
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }
    
    const equipmentId = getQueryParam('equipmentId');
    if (equipmentId) {
      fetch(`${API_BASE}/get?equipmentId=${equipmentId}`)
        .then(res => res.json())
        .then(data => {
          let html = '';
          if (data.length === 0) {
            html = '<p>Nenhuma recomendação encontrada.</p>';
          } else {
            data.forEach(eq => {
              html += `<div class="recommendation">
                <p><strong>${eq.name}</strong></p>
                <p>${eq.description || ''}</p>
                <p>Preço: €${eq.price_day}</p>
              </div>`;
            });
          }
          document.getElementById('recommendations').innerHTML = html;
        })
        .catch(err => {
          document.getElementById('recommendations').innerHTML = `<p>Erro: ${err.message}</p>`;
        });
    } else {
      document.getElementById('recommendations').innerHTML = '<p>ID do equipamento não especificado.</p>';
    }
  </script>
</body>
</html>
