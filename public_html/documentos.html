<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentos Fiscais - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Elite Sound - Documentos Fiscais</h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="order_history.html">Histórico de Pedidos</a></li>
          <li><a href="notifications.html">Notificações</a></li>
          <li><a href="#" id="logout">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <div class="container">
    <h2>Seus Documentos Fiscais</h2>
    <div id="documents-list">
      <!-- Lista de documentos será carregada aqui -->
    </div>
  </div>
  
  <script>
    const API_BASE = 'http://localhost:5000/api';

    async function loadDocuments() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      try {
        // Supondo que o endpoint /documents/my-documents retorna documentos do usuário
        const response = await fetch(`${API_BASE}/documents/my-documents`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Erro ao carregar documentos');
        const documents = await response.json();
        renderDocuments(documents);
      } catch (error) {
        console.error('Erro:', error);
        document.getElementById('documents-list').innerHTML = '<p>Não foi possível carregar seus documentos.</p>';
      }
    }

    function renderDocuments(documents) {
      const listDiv = document.getElementById('documents-list');
      listDiv.innerHTML = '';
      if (documents.length === 0) {
        listDiv.innerHTML = '<p>Você não possui documentos fiscais disponíveis.</p>';
        return;
      }
      documents.forEach(doc => {
        const docDiv = document.createElement('div');
        docDiv.className = 'document-card';
        docDiv.innerHTML = `
          <p><strong>Tipo:</strong> ${doc.type}</p>
          <p><strong>Número:</strong> ${doc.metadata ? doc.metadata.number : 'N/A'}</p>
          <p><strong>Data:</strong> ${doc.uploaded_at ? new Date(doc.uploaded_at).toLocaleDateString() : ''}</p>
          <p><a href="${doc.file_path}" target="_blank">Visualizar Documento</a></p>
          <hr>
        `;
        listDiv.appendChild(docDiv);
      });
    }

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    document.addEventListener('DOMContentLoaded', loadDocuments);
  </script>
</body>
</html>
