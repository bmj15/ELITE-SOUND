<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cálculo de Preço - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .calc-container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #fff;
    }
    .calc-container label {
      display: block;
      margin-top: 10px;
    }
    .calc-container input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    .calc-container button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #28a745;
      border: none;
      color: #fff;
      border-radius: 3px;
      cursor: pointer;
    }
  </style>
  <script src="js/api.js"></script>
</head>
<body>
  <div class="container calc-container">
    <h2>Cálculo de Preço e Cashback</h2>
    <form id="price-form">
      <label for="equipment_id">ID do Equipamento:</label>
      <input type="number" id="equipment_id" required>

      <label for="pickup_date">Data de Levantamento:</label>
      <input type="datetime-local" id="pickup_date" required>

      <label for="return_date">Data de Devolução:</label>
      <input type="datetime-local" id="return_date" required>

      <label for="coupon_code">Cupom de Desconto (opcional):</label>
      <input type="text" id="coupon_code">

      <button type="submit">Calcular</button>
    </form>
    <div id="calc-result"></div>
  </div>

  <script>
    const API_BASE = '/api';

    document.getElementById('price-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const equipment_id = document.getElementById('equipment_id').value;
      const pickup_date = document.getElementById('pickup_date').value;
      const return_date = document.getElementById('return_date').value;
      const coupon_code = document.getElementById('coupon_code').value;

      try {
        const response = await fetch(`${API_BASE}/orders/calculate-price`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ equipment_id, pickup_date, return_date, coupon_code })
        });
        const result = await response.json();
        if (response.ok) {
          document.getElementById('calc-result').innerHTML = `
            <p><strong>Preço Base:</strong> €${result.basePrice.toFixed(2)}</p>
            <p><strong>Desconto Aplicado:</strong> €${result.discountValue.toFixed(2)}</p>
            <p><strong>Preço Final:</strong> €${result.finalPrice.toFixed(2)}</p>
            <p><strong>Cashback a Acumular:</strong> €${result.cashbackAmount.toFixed(2)}</p>
          `;
        } else {
          document.getElementById('calc-result').textContent = result.error || 'Erro no cálculo.';
        }
      } catch (error) {
        document.getElementById('calc-result').textContent = 'Erro na comunicação com o servidor.';
      }
    });
  </script>
</body>
</html>
