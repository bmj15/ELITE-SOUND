<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disparar Notificação - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #fff;
    }
    form label {
      display: block;
      margin-top: 10px;
    }
    form input, form textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    form button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #007bff;
      border: none;
      color: #fff;
      border-radius: 3px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Disparar Notificação Automática</h2>
    <form id="notification-form">
      <label for="userEmail">E-mail do Destinatário:</label>
      <input type="email" id="userEmail" required>

      <label for="subject">Assunto:</label>
      <input type="text" id="subject" required>

      <label for="message">Mensagem:</label>
      <textarea id="message" required></textarea>

      <label for="userId">ID do Usuário (opcional):</label>
      <input type="number" id="userId">

      <button type="submit">Enviar Notificação</button>
    </form>
    <div id="notification-message"></div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api';

    document.getElementById('notification-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const userEmail = document.getElementById('userEmail').value;
      const subject = document.getElementById('subject').value;
      const message = document.getElementById('message').value;
      const userId = document.getElementById('userId').value;

      try {
        const response = await fetch(`${API_BASE}/notifications/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userEmail, subject, message, userId })
        });
        const data = await response.json();
        if (response.ok) {
          document.getElementById('notification-message').textContent = 'Notificação enviada com sucesso!';
        } else {
          document.getElementById('notification-message').textContent = data.error || 'Erro ao enviar notificação.';
        }
      } catch (error) {
        document.getElementById('notification-message').textContent = 'Erro na comunicação com o servidor.';
      }
    });
  </script>
</body>
</html>
