<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contrato de Compra - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>Elite Sound - Contrato de Compra</h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="purchase_orders.html">Pedidos de Compras</a></li>
          <li><a href="#" id="logout">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <h2>Gerar número de contrato</h2>
    <form id="contract-form">
      <label for="purchaseOrderId">ID do pedido de compra:</label>
      <input type="number" id="purchaseOrderId" required>
      <button type="submit">Gerar contrato</button>
    </form>
    <div id="contract-message"></div>
  </div>

  <script>
    const API_BASE = '/api';
    if (!localStorage.getItem('token')) window.location.href = 'login.html';

    document.getElementById('contract-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const purchaseOrderId = document.getElementById('purchaseOrderId').value;
      try {
        const response = await fetch(`${API_BASE}/purchase-contract/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ purchaseOrderId })
        });
        const data = await response.json();
        document.getElementById('contract-message').textContent = response.ok
          ? `Contrato gerado: ${data.contractNumber}`
          : (data.error || 'Erro ao gerar o contrato.');
      } catch (error) {
        document.getElementById('contract-message').textContent = 'Erro na comunicação com o servidor.';
      }
    });

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
