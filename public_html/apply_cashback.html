<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aplicar Cashback - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #fff;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #28a745;
      border: none;
      color: #fff;
      border-radius: 3px;
      cursor: pointer;
    }
  </style>
  <script src="js/api.js"></script>
</head>
<body>
  <div class="container">
    <h2>Aplicar Cashback no Pedido</h2>
    <form id="apply-cashback-form">
      <label for="orderId">ID do Pedido:</label>
      <input type="number" id="orderId" required>
      
      <label for="userId">ID do Usuário:</label>
      <input type="number" id="userId" required>
      
      <label for="amountToApply">Valor de Cashback a Aplicar (€):</label>
      <input type="number" id="amountToApply" step="0.01" required>
      
      <button type="submit">Aplicar Cashback</button>
    </form>
    <div id="cashback-message"></div>
  </div>
  
  <script>
    const API_BASE = '/api';
    
    document.getElementById('apply-cashback-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const orderId = document.getElementById('orderId').value;
      const userId = document.getElementById('userId').value;
      const amountToApply = document.getElementById('amountToApply').value;
      
      try {
        const response = await fetch(`${API_BASE}/cashback/apply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId, userId, amountToApply })
        });
        const data = await response.json();
        if (response.ok) {
          document.getElementById('cashback-message').innerHTML = `
            <p>${data.message}</p>
            <p><strong>Novo total do pedido:</strong> €${parseFloat(data.newOrderTotal).toFixed(2)}</p>
            <p><strong>Novo saldo de cashback:</strong> €${parseFloat(data.newCashbackBalance).toFixed(2)}</p>
          `;
        } else {
          document.getElementById('cashback-message').textContent = data.error || 'Erro ao aplicar cashback.';
        }
      } catch (error) {
        document.getElementById('cashback-message').textContent = 'Erro na comunicação com o servidor.';
      }
    });
  </script>
</body>
</html>
