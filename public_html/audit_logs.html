<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Logs - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .log-card {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 3px;
      background-color: #f0f0f0;
    }
    .log-card p {
      margin: 5px 0;
    }
  </style>
  <script src="js/api.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>Elite Sound - Audit Logs</h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="#" id="logout">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <div class="container">
    <h2>Histórico de Alterações</h2>
    <div id="logs-list">
      <!-- Os logs serão carregados aqui -->
    </div>
  </div>
  <script>
    const API_BASE = '/api';

    async function loadAuditLogs() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      try {
        const response = await fetch(`${API_BASE}/audit`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Erro ao carregar audit logs');
        const logs = await response.json();
        renderLogs(logs);
      } catch (error) {
        document.getElementById('logs-list').innerHTML = `<p>${error.message}</p>`;
      }
    }

    function renderLogs(logs) {
      const listDiv = document.getElementById('logs-list');
      listDiv.innerHTML = '';
      if (logs.length === 0) {
        listDiv.innerHTML = '<p>Nenhum log encontrado.</p>';
        return;
      }
      logs.forEach(log => {
        const card = document.createElement('div');
        card.className = 'log-card';
        card.innerHTML = `
          <p><strong>Usuário:</strong> ${log.user_id || 'N/A'}</p>
          <p><strong>Ação:</strong> ${log.action}</p>
          <p><strong>Tipo de Alteração:</strong> ${log.change_type}</p>
          <p><strong>Detalhes:</strong> ${log.change_details}</p>
          <p><strong>Data:</strong> ${new Date(log.created_at).toLocaleString()}</p>
        `;
        listDiv.appendChild(card);
      });
    }

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    document.addEventListener('DOMContentLoaded', loadAuditLogs);
  </script>
</body>
</html>
