<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Fornecedores - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .supplier-card {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px 0;
      border-radius: 3px;
      background-color: #f9f9f9;
    }
  </style>
  <script src="js/api.js"></script>
</head>
<body>
  <div class="container">
    <h1>Fornecedores</h1>
    <div id="suppliers-list"></div>
    <hr>
    <h3>Adicionar Novo Fornecedor</h3>
    <form id="supplier-form">
      <label for="name">Nome:</label>
      <input type="text" id="name" required>
      <label for="country">País:</label>
      <input type="text" id="country" required>
      <label for="tax_id">NIF/Tax ID:</label>
      <input type="text" id="tax_id">
      <label for="address">Endereço:</label>
      <textarea id="address"></textarea>
      <label for="contact_info">Contato:</label>
      <input type="text" id="contact_info">
      <button type="submit">Adicionar Fornecedor</button>
    </form>
    <div id="supplier-message"></div>
  </div>
  
  <script>
    const API_BASE = '/api/suppliers';
    
    async function loadSuppliers() {
      try {
        const res = await fetch(API_BASE);
        const suppliers = await res.json();
        renderSuppliers(suppliers);
      } catch (error) {
        document.getElementById('suppliers-list').textContent = 'Erro ao carregar fornecedores.';
      }
    }
    
    function renderSuppliers(suppliers) {
      const list = document.getElementById('suppliers-list');
      list.innerHTML = '';
      if (suppliers.length === 0) {
        list.innerHTML = '<p>Nenhum fornecedor encontrado.</p>';
        return;
      }
      suppliers.forEach(supplier => {
        list.innerHTML += `<div class="supplier-card">
          <p><strong>Nome:</strong> ${supplier.name}</p>
          <p><strong>País:</strong> ${supplier.country}</p>
          <p><strong>NIF:</strong> ${supplier.tax_id || 'N/A'}</p>
          <p><strong>Contato:</strong> ${supplier.contact_info || 'N/A'}</p>
        </div>`;
      });
    }
    
    document.getElementById('supplier-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const country = document.getElementById('country').value;
      const tax_id = document.getElementById('tax_id').value;
      const address = document.getElementById('address').value;
      const contact_info = document.getElementById('contact_info').value;
      
      try {
        const res = await fetch(API_BASE + '/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, country, tax_id, address, contact_info })
        });
        const data = await res.json();
        document.getElementById('supplier-message').textContent = data.message || data.error;
        loadSuppliers();
        e.target.reset();
      } catch (error) {
        document.getElementById('supplier-message').textContent = 'Erro na comunicação com o servidor.';
      }
    });
    
    document.addEventListener('DOMContentLoaded', loadSuppliers);
  </script>
</body>
</html>
