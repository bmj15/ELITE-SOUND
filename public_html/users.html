<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utilizadores - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
  <style>
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    td, th { border: 1px solid #ddd; padding: 6px; text-align: left; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Elite Sound - Utilizadores</h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="#" id="logout">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <h2>Utilizadores e papéis</h2>
    <p>Os novos registos entram como <strong>cliente</strong>. Passe a <strong>colaborador</strong> quem trabalha na Elite Sound
      (recebe comissões e acede à área da equipa) e a <strong>admin</strong> quem gere o sistema.</p>
    <div class="table-wrap" id="users"></div>
    <div id="users-message"></div>
  </div>

  <script>
    const API_BASE = '/api';
    if (!localStorage.getItem('token')) window.location.href = 'login.html';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const ROLES = { client: 'Cliente', collaborator: 'Colaborador', admin: 'Admin' };

    async function loadUsers() {
      try {
        const response = await fetch(`${API_BASE}/users`);
        if (!response.ok) throw new Error();
        const users = await response.json();
        document.getElementById('users').innerHTML = `<table>
          <tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Papel</th></tr>
          ${users.map(u => `<tr>
            <td>${u.id}</td>
            <td>${esc(u.name)}</td>
            <td>${esc(u.email)}</td>
            <td><select data-user="${u.id}">
              ${Object.entries(ROLES).map(([value, label]) => `<option value="${value}" ${u.role === value ? 'selected' : ''}>${label}</option>`).join('')}
            </select></td>
          </tr>`).join('')}
        </table>`;
      } catch (error) {
        document.getElementById('users').innerHTML = '<p>Não foi possível carregar os utilizadores.</p>';
      }
    }

    document.getElementById('users').addEventListener('change', async (e) => {
      const id = e.target.dataset.user;
      if (!id) return;
      const response = await fetch(`${API_BASE}/users/${id}/role`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: e.target.value })
      });
      const data = await response.json();
      document.getElementById('users-message').textContent = data.message || data.error;
      loadUsers();
    });

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });

    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>
</body>
</html>
