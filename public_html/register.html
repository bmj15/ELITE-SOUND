<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
</head>
<body>
  <div class="container">
    <h2>Cadastro de Usuário</h2>
    <form id="register-form">
      <label for="name">Nome:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Senha:</label>
      <input type="password" id="password" name="password" required>

      <label for="confirm_password">Confirmar Senha:</label>
      <input type="password" id="confirm_password" name="confirm_password" required>

      <button type="submit">Cadastrar</button>
    </form>
    <div id="register-message"></div>
    <p>Já tem conta? <a href="login.html">Entrar</a></p>
  </div>

  <script>
    const API_BASE = '/api';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      
      if(password !== confirmPassword) {
        document.getElementById('register-message').textContent = 'As senhas não coincidem.';
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/users/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        
        const data = await response.json();
        if(response.ok) {
          document.getElementById('register-message').textContent = 'Cadastro realizado com sucesso! Redirecionando...';
          // Redireciona para o dashboard ou página de login após alguns segundos
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          document.getElementById('register-message').textContent = data.error || 'Erro no cadastro.';
        }
      } catch (error) {
        document.getElementById('register-message').textContent = 'Erro na comunicação com o servidor.';
      }
    });
  </script>
</body>
</html>
