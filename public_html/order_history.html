<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico de Pedidos - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>Elite Sound - Histórico de Pedidos</h1>
      <nav>
        <ul>
          <li><a href="index.html">Catálogo</a></li>
          <li><a href="dashboard.html">Minha Conta</a></li>
          <li><a href="order_history.html">Histórico de Pedidos</a></li>
          <li><a href="#" id="logout">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <h2>Seus Pedidos</h2>
    <div id="history-list">
      <!-- Aqui serão listados os pedidos completos -->
    </div>
  </div>

  <script>
    const API_BASE = '/api';

    // Função para buscar o histórico de pedidos do usuário autenticado
    async function loadOrderHistory() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/orders/my-orders`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Erro ao carregar o histórico de pedidos');
        const orders = await response.json();
        renderOrderHistory(orders);
      } catch (error) {
        console.error(error);
        document.getElementById('history-list').innerHTML = '<p>Não foi possível carregar o histórico de pedidos.</p>';
      }
    }

    // Função para renderizar os pedidos na página
    function renderOrderHistory(orders) {
      const historyList = document.getElementById('history-list');
      historyList.innerHTML = '';
      if (orders.length === 0) {
        historyList.innerHTML = '<p>Você não possui pedidos no histórico.</p>';
        return;
      }
      orders.forEach(order => {
        const orderDiv = document.createElement('div');
        orderDiv.className = 'order-card';
        orderDiv.innerHTML = `
          <p><strong>ID:</strong> ${order.id}</p>
          <p><strong>Status:</strong> ${order.status}</p>
          <p><strong>Data de Levantamento:</strong> ${new Date(order.pickup_date).toLocaleString()}</p>
          <p><strong>Data de Devolução:</strong> ${new Date(order.return_date).toLocaleString()}</p>
          ${order.document_url ? `<p><a href="${order.document_url}" target="_blank">Ver Documento Fiscal</a></p>` : ''}
          <hr>
        `;
        historyList.appendChild(orderDiv);
      });
    }

    // Função para realizar logout
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    document.addEventListener('DOMContentLoaded', loadOrderHistory);
  </script>
</body>
</html>
