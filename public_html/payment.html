<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagamento - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .payment-container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #fff;
    }
    .payment-container label {
      display: block;
      margin-top: 10px;
    }
    .payment-container input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    .payment-container button {
      margin-top: 15px;
      padding: 10px;
      background-color: #28a745;
      border: none;
      color: #fff;
      border-radius: 3px;
      cursor: pointer;
    }
  </style>
  <script src="js/api.js"></script>
</head>
<body>
  <div class="container payment-container">
    <h2>Processar Pagamento</h2>
    <form id="payment-form">
      <label for="orderId">ID do Pedido:</label>
      <input type="number" id="orderId" required>

      <label for="amount">Valor a Pagar (€):</label>
      <input type="number" id="amount" step="0.01" required>

      <!-- Exemplo simples de dados do cartão; em produção, utilize um serviço de pagamento seguro -->
      <label for="cardNumber">Número do Cartão:</label>
      <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" required>

      <label for="expiryDate">Data de Expiração (MM/AA):</label>
      <input type="text" id="expiryDate" placeholder="MM/AA" required>

      <label for="cvv">CVV:</label>
      <input type="text" id="cvv" placeholder="123" required>

      <button type="submit">Pagar</button>
    </form>
    <div id="payment-message"></div>
  </div>

  <script>
    // Preenche o pedido quando a página é aberta a partir do dashboard (payment.html?orderId=…)
    document.addEventListener('DOMContentLoaded', () => {
      const orderId = new URLSearchParams(window.location.search).get('orderId');
      if (orderId) document.getElementById('orderId').value = orderId;
    });
    const API_BASE = '/api';

    document.getElementById('payment-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const orderId = document.getElementById('orderId').value;
      const amount = document.getElementById('amount').value;
      const cardNumber = document.getElementById('cardNumber').value;
      const expiryDate = document.getElementById('expiryDate').value;
      const cvv = document.getElementById('cvv').value;

      // Em um cenário real, os dados do cartão devem ser enviados de forma segura para o gateway.
      // Aqui, simulamos a requisição.
      try {
        const response = await fetch(`${API_BASE}/payments/process`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId, amount, cardNumber, expiryDate, cvv })
        });
        const data = await response.json();
        if (response.ok) {
          document.getElementById('payment-message').textContent = data.message;
          // Após pagamento, redirecione ou atualize o status do pedido
        } else {
          document.getElementById('payment-message').textContent = data.error || 'Erro ao processar pagamento.';
        }
      } catch (error) {
        document.getElementById('payment-message').textContent = 'Erro na comunicação com o servidor.';
      }
    });
  </script>
</body>
</html>
