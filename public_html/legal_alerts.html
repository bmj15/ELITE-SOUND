<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avisos Legais - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .alert-card {
      border: 1px solid #e0a800;
      background-color: #fff3cd;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 3px;
    }
    .alert-card h4 {
      margin: 0 0 5px;
    }
  </style>
  <script src="js/api.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>Elite Sound - Avisos Legais</h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="fiscal_obligations.html">Obrigações Fiscais</a></li>
          <li><a href="#" id="logout">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <div class="container">
    <h2>Seus Avisos Legais e Contributivos</h2>
    <div id="alerts-list">
      <!-- Avisos serão carregados aqui -->
    </div>
  </div>
  
  <script>
    const API_BASE = '/api';

    async function loadLegalAlerts() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      try {
        // Endpoint que retorna os avisos legais e contributivos para o usuário
        const response = await fetch(`${API_BASE}/legal_alerts`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Erro ao carregar avisos legais');
        const alerts = await response.json();
        renderAlerts(alerts);
      } catch (error) {
        document.getElementById('alerts-list').innerHTML = '<p>Não foi possível carregar os avisos legais.</p>';
      }
    }

    function renderAlerts(alerts) {
      const listDiv = document.getElementById('alerts-list');
      listDiv.innerHTML = '';
      if (alerts.length === 0) {
        listDiv.innerHTML = '<p>Você não possui avisos legais no momento.</p>';
        return;
      }
      alerts.forEach(alert => {
        const card = document.createElement('div');
        card.className = 'alert-card';
        card.innerHTML = `
          <h4>${alert.title || 'Aviso'}</h4>
          <p>${alert.message}</p>
          <small>${new Date(alert.due_date).toLocaleDateString()}</small>
        `;
        listDiv.appendChild(card);
      });
    }

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    document.addEventListener('DOMContentLoaded', loadLegalAlerts);
  </script>
</body>
</html>
