<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações do Sistema - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .config-container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #fff;
    }
    .config-item {
      margin-bottom: 20px;
    }
    .config-item label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .config-item input {
      width: 100%;
      padding: 8px;
      margin-bottom: 5px;
    }
    .config-item button {
      padding: 8px 15px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
  </style>
  <script src="js/api.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>Elite Sound - Configurações do Sistema</h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="#" id="logout">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <div class="container config-container">
    <h2>Gerenciar Configurações</h2>
    <div id="configurations-list">
      <!-- Configurações serão carregadas aqui -->
    </div>
  </div>
  
  <script>
    const API_BASE = '/api';

    async function loadConfigurations() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      try {
        const response = await fetch(`${API_BASE}/configurations`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Erro ao carregar configurações');
        const configs = await response.json();
        renderConfigurations(configs);
      } catch (error) {
        document.getElementById('configurations-list').innerHTML = '<p>Não foi possível carregar as configurações.</p>';
      }
    }

    function renderConfigurations(configs) {
      const listDiv = document.getElementById('configurations-list');
      listDiv.innerHTML = '';
      configs.forEach(config => {
        const configDiv = document.createElement('div');
        configDiv.className = 'config-item';
        configDiv.innerHTML = `
          <label for="${config.config_key}">${config.config_key}</label>
          <input type="text" id="${config.config_key}" value="${config.config_value}">
          <button onclick="updateConfig('${config.config_key}')">Atualizar</button>
          <hr>
        `;
        listDiv.appendChild(configDiv);
      });
    }

    async function updateConfig(key) {
      const token = localStorage.getItem('token');
      const newValue = document.getElementById(key).value;
      try {
        const response = await fetch(`${API_BASE}/configurations/${key}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ config_value: newValue })
        });
        const data = await response.json();
        if (response.ok) {
          alert(`Configuração ${key} atualizada com sucesso!`);
        } else {
          alert(data.error || 'Erro ao atualizar configuração.');
        }
      } catch (error) {
        alert('Erro na comunicação com o servidor.');
      }
    }

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    document.addEventListener('DOMContentLoaded', loadConfigurations);
  </script>
</body>
</html>
