<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmação de Pagamento - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .order-card {
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 3px;
      background-color: #f9f9f9;
    }
    .payment-input {
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Elite Sound - Confirmação de Pagamento</h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="order_history.html">Histórico de Pedidos</a></li>
          <li><a href="#" id="logout">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <div class="container">
    <h2>Pedidos com Pagamento Pendente</h2>
    <div id="pending-orders">
      <!-- Lista de pedidos com pagamento pendente será carregada aqui -->
    </div>
  </div>
  
  <script>
    const API_BASE = 'http://localhost:5000/api';

    async function loadPendingOrders() {
      const token = localStorage.getItem('token');
      if (!token) { window.location.href = 'login.html'; return; }
      try {
        // Supondo que o endpoint /orders/pending retorne os pedidos com pagamento pendente
        const response = await fetch(`${API_BASE}/orders/pending`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Erro ao carregar pedidos pendentes');
        const orders = await response.json();
        renderPendingOrders(orders);
      } catch (error) {
        document.getElementById('pending-orders').innerHTML = '<p>Não foi possível carregar os pedidos pendentes.</p>';
      }
    }

    function renderPendingOrders(orders) {
      const container = document.getElementById('pending-orders');
      container.innerHTML = '';
      if (orders.length === 0) {
        container.innerHTML = '<p>Não há pedidos com pagamento pendente.</p>';
        return;
      }
      orders.forEach(order => {
        const card = document.createElement('div');
        card.className = 'order-card';
        card.innerHTML = `
          <p><strong>ID do Pedido:</strong> ${order.id}</p>
          <p><strong>Cliente:</strong> ${order.client_name || order.client_id}</p>
          <p><strong>Valor Total:</strong> €${order.total_value}</p>
          <p><strong>Pagamento Exigido:</strong> ${order.payment_percentage_required}%</p>
          <label>Valor Pago (€):</label>
          <input type="number" step="0.01" class="payment-input" id="payment_${order.id}" placeholder="Informe o valor pago">
          <button onclick="confirmPayment(${order.id})" class="btn">Confirmar Pagamento</button>
          <hr>
        `;
        container.appendChild(card);
      });
    }

    async function confirmPayment(orderId) {
      const token = localStorage.getItem('token');
      const paymentValue = document.getElementById(`payment_${orderId}`).value;
      if (!paymentValue) {
        alert('Informe o valor pago.');
        return;
      }
      try {
        const response = await fetch(`${API_BASE}/orders/${orderId}/confirm-payment`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ amount_paid: paymentValue })
        });
        const data = await response.json();
        if (response.ok) {
          alert('Pagamento confirmado com sucesso!');
          loadPendingOrders();
        } else {
          alert(data.error || 'Erro ao confirmar pagamento.');
        }
      } catch (error) {
        alert('Erro na comunicação com o servidor.');
      }
    }

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    document.addEventListener('DOMContentLoaded', loadPendingOrders);
  </script>
</body>
</html>
