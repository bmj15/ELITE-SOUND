<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notificações - Elite Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .notification {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #f9f9f9;
    }
    .notification.unread {
      border-left: 5px solid #007bff;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Elite Sound - Notificações</h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="order_history.html">Histórico de Pedidos</a></li>
          <li><a href="documentos.html">Documentos</a></li>
          <li><a href="#" id="logout">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <h2>Suas Notificações</h2>
    <div id="notifications-list">
      <!-- Notificações serão listadas aqui -->
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api';

    async function loadNotifications() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      try {
        // Supondo que o endpoint /notifications/my-notifications retorna as notificações do usuário
        const response = await fetch(`${API_BASE}/notifications/my-notifications`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Erro ao carregar notificações');
        const notifications = await response.json();
        renderNotifications(notifications);
      } catch (error) {
        console.error('Erro:', error);
        document.getElementById('notifications-list').innerHTML = '<p>Não foi possível carregar suas notificações.</p>';
      }
    }

    function renderNotifications(notifications) {
      const listDiv = document.getElementById('notifications-list');
      listDiv.innerHTML = '';
      if (notifications.length === 0) {
        listDiv.innerHTML = '<p>Você não possui notificações.</p>';
        return;
      }
      notifications.forEach(note => {
        const noteDiv = document.createElement('div');
        noteDiv.className = 'notification ' + (!note.is_read ? 'unread' : '');
        noteDiv.innerHTML = `
          <p>${note.message}</p>
          <small>${new Date(note.created_at).toLocaleString()}</small>
        `;
        listDiv.appendChild(noteDiv);
      });
    }

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    document.addEventListener('DOMContentLoaded', loadNotifications);
  </script>
</body>
</html>
