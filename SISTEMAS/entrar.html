<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Grupo BXB</title>
<script src="shared/servidor-dados.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/spap.css?v=10">
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 50% at 20% 20%,rgba(139,92,246,.18),transparent 60%),radial-gradient(60% 50% at 80% 80%,rgba(201,162,39,.16),transparent 60%),var(--bg)}
  .caixa{width:min(440px,100%)}
  h1{font-size:30px;letter-spacing:-1px;margin:0 0 6px}
</style>
</head>
<body>
<div class="caixa card">
  <div class="muted" style="letter-spacing:.14em;font-size:12px;text-transform:uppercase">Servidor do Grupo BXB</div>
  <div id="c"></div>
</div>
<script>
(function () {
  'use strict';
  var S = window.BXBServidor || {}, c = document.getElementById('c');
  var voltar = new URLSearchParams(location.search).get('voltar') || '/SISTEMAS/index.html';
  if (!/^\/[^/]/.test(voltar)) voltar = '/SISTEMAS/index.html';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (x) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]; }); };
  function post(url, corpo) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-BXB': '1' }, body: JSON.stringify(corpo) }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }); }
  function erro(t) { var e = document.getElementById('erro'); e.innerHTML = t ? '<div class="alert bad" style="margin-top:12px"><div>' + esc(t) + '</div></div>' : ''; }
  if (S.sessao) {
    c.innerHTML = '<h1>Olá, ' + esc(S.sessao.nome.split(' ')[0]) + '</h1><p class="muted">Já tem sessão iniciada no servidor.</p><div class="row" style="gap:8px;margin-top:16px"><a class="btn primary" href="' + esc(voltar) + '">Continuar</a><button class="btn" id="sair">Sair</button></div>';
    document.getElementById('sair').onclick = function () { post('/api/sair', {}).then(function () { location.reload(); }); };
    return;
  }
  if (S.configurado === false) {
    c.innerHTML = '<h1>Configurar o servidor</h1><p class="muted">Crie a conta de administrador. Depois pode criar as contas das outras pessoas e escolher os sistemas a que cada uma tem acesso.</p>' +
      '<form class="form" id="f"><div class="fld full"><label>Nome</label><input class="inp" name="nome" required></div><div class="fld full"><label>Utilizador</label><input class="inp" name="utilizador" autocomplete="username" required></div>' +
      '<div class="fld full"><label>Palavra-passe (mín. 8 caracteres)</label><input class="inp" type="password" name="palavra" autocomplete="new-password" required></div><div class="fld full"><label>Repetir palavra-passe</label><input class="inp" type="password" name="palavra2" autocomplete="new-password" required></div>' +
      '<div class="fld full"><button class="btn primary" type="submit">Criar conta e entrar</button></div></form><div id="erro"></div>';
    document.getElementById('f').onsubmit = function (e) { e.preventDefault(); var f = Object.fromEntries(new FormData(e.target));
      if (f.palavra !== f.palavra2) return erro('As palavras-passe não coincidem');
      post('/api/configurar', { nome: f.nome, utilizador: f.utilizador, palavra: f.palavra }).then(function (r) { if (!r.ok) return erro(r.j.erro); location.replace(voltar); }); };
    return;
  }
  c.innerHTML = '<h1>Entrar</h1><p class="muted">Use a sua conta do servidor. Depois, dentro de cada sistema, entra com o seu utilizador e PIN.</p>' +
    '<form class="form" id="f"><div class="fld full"><label>Utilizador</label><input class="inp" name="utilizador" autocomplete="username" required autofocus></div><div class="fld full"><label>Palavra-passe</label><input class="inp" type="password" name="palavra" autocomplete="current-password" required></div>' +
    '<div class="fld full"><button class="btn primary" type="submit">Entrar</button></div></form><div id="erro"></div>';
  document.getElementById('f').onsubmit = function (e) { e.preventDefault(); var f = Object.fromEntries(new FormData(e.target));
    post('/api/entrar', f).then(function (r) { if (!r.ok) return erro(r.j.erro); location.replace(voltar); }); };
})();
</script>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('spap:theme')||'dark')}catch(e){}</script>
</body>
</html>
