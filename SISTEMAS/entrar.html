<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="/SISTEMAS/manifest.json">
<link rel="icon" type="image/png" href="/SISTEMAS/icones/favicon-32.png">
<link rel="apple-touch-icon" href="/SISTEMAS/icones/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BXB">
<title>Entrar · BXB</title>
<script src="shared/servidor-dados.js?v=7"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/spap.css?v=49">
<style>
  body{min-height:100vh;margin:0;display:flex;flex-direction:column;background:radial-gradient(50% 40% at 15% 0%,rgba(139,92,246,.16),transparent 60%),var(--bg)}
  .topo{border-bottom:1px solid var(--line);background:rgba(0,0,0,.18)}
  .topo .in{display:flex;align-items:center;gap:18px;height:64px;max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
  .marca{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.3px;color:var(--text);text-decoration:none}
  .marca i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:12.5px;background:linear-gradient(135deg,#8b5cf6,#6366f1 45%,#22d3ee);color:#fff}
  .area-t{color:var(--muted);font-weight:600;font-size:14px;padding-left:16px;border-left:1px solid var(--line2)}
  .topo nav{display:flex;align-items:stretch;height:100%;margin-left:auto}
  .topo nav button{border:0;background:none;color:var(--muted);font:600 14px Inter,system-ui,sans-serif;padding:0 14px;cursor:pointer;position:relative}
  .topo nav button.on{color:var(--text)}.topo nav button.on:after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,#8b5cf6,#22d3ee)}
  .topo .aj{color:var(--muted);font-weight:600;font-size:14px;text-decoration:none;padding-left:12px}.topo .aj:hover{color:var(--text)}
  main{flex:1;display:grid;grid-template-columns:minmax(320px,460px) minmax(260px,360px);justify-content:center;gap:clamp(20px,4vw,48px);align-items:start;padding:clamp(28px,6vh,64px) clamp(16px,4vw,32px) 40px;width:100%;box-sizing:border-box}
  .caixa{padding:30px;border-radius:22px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .caixa h2{margin:0 0 4px;font-size:26px;letter-spacing:-.5px}
  .caixa .sub2{color:var(--muted);margin:0 0 22px;font-size:14.5px}
  .fl{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .fl label{font-size:13px;font-weight:600;color:var(--muted)}
  .fl .inp{padding:12px 14px;font-size:16px}
  .pw{position:relative}.pw .inp{width:100%;box-sizing:border-box;padding-right:72px}
  .pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font:600 12px Inter,system-ui,sans-serif;cursor:pointer;padding:6px}
  .principal{width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:4px}
  .linha{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--muted)}
  .linha a{color:#a78bfa;font-weight:600;text-decoration:none;cursor:pointer}
  .dois{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .nota{font-size:12.5px;color:var(--faint);margin-top:14px;line-height:1.5}
  .lado{display:grid;gap:14px}
  .bloco{padding:20px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
  .bloco h3{margin:0 0 6px;font-size:16px}.bloco p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
  .bloco ul{list-style:none;margin:0;padding:0;display:grid}
  .bloco li a{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14.5px}
  .bloco li:first-child a{border-top:0}.bloco li a:after{content:"›";color:var(--muted)}.bloco li a:hover{color:#a78bfa}
  .bloco.alerta{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.25)}
  .bloco.alerta h3{display:flex;gap:8px;align-items:center;color:#fcd34d}.bloco.alerta p{margin:0}
  .bloco .btn{width:100%;justify-content:center;text-decoration:none;box-sizing:border-box}
  footer{border-top:1px solid var(--line);color:var(--faint);font-size:12.5px}
  footer .in{max-width:1120px;margin:0 auto;padding:18px clamp(16px,4vw,32px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  footer a{color:var(--muted);text-decoration:none;margin-right:16px}footer a:hover{color:var(--text)}
  @media (max-width:860px){main{grid-template-columns:minmax(0,460px)}}
  @media (max-width:560px){.area-t{display:none}.topo nav button{padding:0 9px}.topo .aj{display:none}.caixa{padding:22px 18px;border-radius:18px}.dois{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topo"><div class="in">
  <a class="marca" href="/"><i>BXB</i>BXB</a><span class="area-t">Área de cliente</span>
  <nav id="navt"><button type="button" data-t="particular" class="on">Particulares</button><button type="button" data-t="empresa">Empresas</button></nav>
  <a class="aj" href="/ajuda">Ajuda</a>
</div></header>
<main>
  <section class="caixa" id="c"></section>
  <aside class="lado" id="lado"></aside>
</main>
<footer><div class="in"><span><a href="/ajuda">Centro de ajuda</a><a href="/simuladores">Simuladores</a><a href="/artigos">Artigos</a><a href="/artigos/proteger-a-sua-conta">Segurança online</a></span><span>© BXB</span></div></footer>
<script>
(function () {
  'use strict';
  var S = window.BXBServidor || {}, c = document.getElementById('c'), lado = document.getElementById('lado');
  var q = new URLSearchParams(location.search), voltar = q.get('voltar') || '/SISTEMAS/index.html';
  if (!/^\/[^/]/.test(voltar)) voltar = '/SISTEMAS/index.html';
  var tipo = q.get('tipo') === 'empresa' ? 'empresa' : 'particular', vista = q.get('criar') ? 'criar' : 'entrar';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (x) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]; }); };
  function post(url, corpo) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-BXB': '1' }, body: JSON.stringify(corpo) }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); }, function () { return { ok: false, j: { erro: 'Sem ligação ao servidor' } }; }); }
  function erro(t) { var e = document.getElementById('erro'); if (e) e.innerHTML = t ? '<div class="alert bad" style="margin-top:14px"><div>' + esc(t) + '</div></div>' : ''; }
  function pintarLado() {
    var emp = tipo === 'empresa', aj = [['abrir-conta', 'Como abro uma conta?'], ['esqueci-palavra-passe', 'Esqueci-me da palavra-passe'], ['palavra-passe-e-pin', 'Palavra-passe e PIN: qual a diferença?']];
    if (emp) aj.push(['colaboradores', 'Como entram os colaboradores?']); else aj.push(['partilhar-despesas', 'Como funcionam as partilhas?']);
    lado.innerHTML = (S.sessao ? '' : vista === 'criar'
      ? '<div class="bloco"><h3>Já é cliente?</h3><p>Entre com o seu email e palavra-passe.</p><a class="btn" href="#" data-vista="entrar">Entrar</a></div>'
      : '<div class="bloco"><h3>Ainda não é cliente?</h3><p>' + (emp ? 'Abra a área da empresa e convide a equipa.' : 'Abra a sua conta e comece pelo plano pessoal.') + ' Demora um minuto.</p><a class="btn primary" href="#" data-vista="criar">Abrir conta</a></div>') +
      '<div class="bloco"><h3>Ajuda rápida</h3><ul>' + aj.map(function (x) { return '<li><a href="/ajuda?p=' + x[0] + '">' + x[1] + '</a></li>'; }).join('') + '</ul></div>' +
      '<div class="bloco alerta"><h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>Atenção à fraude</h3><p>A BXB nunca pede a palavra-passe, o PIN ou códigos por email, SMS ou telefone. Entre sempre escrevendo o endereço do site.</p></div>';
    lado.querySelectorAll('[data-vista]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); vista = a.dataset.vista; pintar(); }; });
  }
  function guardaTipo() { try { sessionStorage.setItem('bxb:tipo', tipo); } catch (e) { } }
  function mudarTipo(t) { tipo = t; document.querySelectorAll('[data-t]').forEach(function (b) { b.classList.toggle('on', b.dataset.t === tipo); }); pintarLado(); if (!S.sessao) pintar(); }
  document.querySelectorAll('#navt [data-t]').forEach(function (b) { b.onclick = function () { mudarTipo(b.dataset.t); }; });
  var seg = function () { return ''; };
  var campo = function (rot, nome, extra) { return '<div class="fl"><label>' + rot + '</label><input class="inp" name="' + nome + '" ' + (extra || '') + '></div>'; };
  var senha = function (rot, nome, auto) { return '<div class="fl"><label>' + rot + '</label><div class="pw"><input class="inp" type="password" name="' + nome + '" autocomplete="' + auto + '" required><button type="button" data-ver>Mostrar</button></div></div>'; };
  function ligar() {
    c.querySelectorAll('.seg [data-t]').forEach(function (b) { b.onclick = function () { mudarTipo(b.dataset.t); }; });
    c.querySelectorAll('[data-ver]').forEach(function (b) { b.onclick = function () { var i = b.previousElementSibling, v = i.type === 'password'; i.type = v ? 'text' : 'password'; b.textContent = v ? 'Esconder' : 'Mostrar'; }; });
    c.querySelectorAll('[data-vista]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); vista = a.dataset.vista; pintar(); }; });
  }
  function pintar() {
    if (vista === 'criar') {
      c.innerHTML = '<h2>Abrir conta</h2><p class="sub2">' + (tipo === 'empresa' ? 'Empresas · área da empresa com pagamentos, tesouraria e equipa' : 'Particulares · plano pessoal') + '</p>' + seg() +
        '<form id="f" autocomplete="on">' + (tipo === 'empresa' ? '<div class="dois">' + campo('Nome da empresa', 'empresa', 'required autocomplete="organization"') + campo('NIF (opcional)', 'nif', 'inputmode="numeric" maxlength="9"') + '</div>' : '') +
        campo(tipo === 'empresa' ? 'O seu nome' : 'Nome', 'nome', 'required autocomplete="name"') + campo('Email', 'email', 'type="email" required autocomplete="email"') +
        senha('Palavra-passe (mín. 8 caracteres)', 'palavra', 'new-password') + senha('Repetir palavra-passe', 'palavra2', 'new-password') +
        '<button class="btn primary principal" type="submit">Criar conta</button></form><div id="erro"></div>' +
        '<div class="linha"><span>Já é cliente?</span><a data-vista="entrar">Entrar</a></div>' +
        '<div class="nota">O PIN para assinar operações é definido na primeira assinatura.</div>';
      pintarLado();
      ligar();
      document.getElementById('f').onsubmit = function (e) { e.preventDefault(); var f = Object.fromEntries(new FormData(e.target)); erro('');
        if (f.palavra !== f.palavra2) return erro('As palavras-passe não coincidem');
        var b = e.target.querySelector('[type=submit]'); b.disabled = true;
        post('/api/registar', { tipo: tipo, nome: f.nome, email: f.email, palavra: f.palavra, empresa: f.empresa, nif: f.nif }).then(function (r) { b.disabled = false; if (!r.ok) return erro(r.j.erro || 'Não foi possível criar a conta'); guardaTipo(); location.replace(r.j.destino || voltar); }); };
      return;
    }
    c.innerHTML = '<h2>Entrar</h2><p class="sub2">' + (tipo === 'empresa' ? 'Empresas' : 'Particulares') + '</p>' + seg() +
      '<form id="f" autocomplete="on">' + campo('Email', 'email', 'type="text" required autocomplete="username" autofocus') + senha('Palavra-passe', 'palavra', 'current-password') +
      '<button class="btn primary principal" type="submit">Entrar</button></form><div id="erro"></div>' +
      '<div class="linha"><a data-vista="esqueci">Esqueci-me da palavra-passe</a><a data-vista="criar">Abrir conta</a></div>';
    ligar(); pintarLado();
    var esq = c.querySelector('[data-vista="esqueci"]'); esq.onclick = function (e) { e.preventDefault(); erro(''); document.getElementById('erro').innerHTML = '<div class="alert info" style="margin-top:14px"><div>Peça ao apoio BXB para redefinir a palavra-passe. Por segurança, não é enviada por email.</div></div>'; };
    document.getElementById('f').onsubmit = function (e) { e.preventDefault(); var f = Object.fromEntries(new FormData(e.target)); erro('');
      var b = e.target.querySelector('[type=submit]'); b.disabled = true;
      post('/api/entrar', { email: f.email, palavra: f.palavra, tipo: tipo }).then(function (r) { b.disabled = false; if (!r.ok) return erro(r.j.erro || 'Não foi possível entrar'); guardaTipo(); location.replace(voltar); }); };
  }
  pintarLado();
  document.querySelectorAll('#navt [data-t]').forEach(function (b) { b.classList.toggle('on', b.dataset.t === tipo); });
  if (S.sessao) {
    c.innerHTML = '<h2>Olá, ' + esc(String(S.sessao.nome || '').split(' ')[0]) + '</h2><p class="sub2">Já tem sessão iniciada.</p><button class="btn primary principal" id="cont">Continuar</button><div class="linha"><span>' + esc(S.sessao.email || S.sessao.utilizador || '') + '</span><a id="sair">Sair</a></div>';
    c.querySelector('.sub2').insertAdjacentHTML('afterend', seg()); ligar();
    document.getElementById('cont').onclick = function () { guardaTipo(); location.replace(voltar); };
    document.getElementById('sair').onclick = function () { post('/api/sair', {}).then(function () { location.reload(); }); };
    return;
  }
  if (S.configurado === false) {
    c.innerHTML = '<h2>Configurar o servidor</h2><p class="sub2">Crie a conta de administrador.</p><form id="f">' + campo('Nome', 'nome', 'required') + campo('Email', 'email', 'type="email" required autocomplete="email"') +
      senha('Palavra-passe (mín. 8 caracteres)', 'palavra', 'new-password') + senha('Repetir palavra-passe', 'palavra2', 'new-password') + '<button class="btn primary principal" type="submit">Criar conta e entrar</button></form><div id="erro"></div>';
    ligar();
    document.getElementById('f').onsubmit = function (e) { e.preventDefault(); var f = Object.fromEntries(new FormData(e.target));
      if (f.palavra !== f.palavra2) return erro('As palavras-passe não coincidem');
      post('/api/configurar', { nome: f.nome, utilizador: f.email, palavra: f.palavra }).then(function (r) { if (!r.ok) return erro(r.j.erro); location.replace(voltar); }); };
    return;
  }
  pintar();
})();
</script>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('spap:theme')||'dark')}catch(e){}</script>
</body>
</html>
