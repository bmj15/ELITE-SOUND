    return '<div class="slide s' + (i + 1) + '" aria-label="' + (i + 1) + ' de ' + D.slides.length + '"><div class="wrap"><div><span class="tag">' + s.tag + '</span>' + (i ? '<h2 class="h">' : '<h1>') + s.h + (i ? '</h2>' : '</h1>') + '<p>' + s.p + '</p><div class="ctas"><a class="btn btn-p" href="' + s.c1[1] + '">' + s.c1[0] + ' ' + ic('i-seta', 18) + '</a>' + (s.c2 ? '<a class="btn btn-s" href="' + s.c2[1] + '">' + s.c2[0] + '</a>' : '') + '</div></div><div class="arte">' + ARTE[s.arte] + '</div></div></div>'; }).join('') +
    '</div><div class="carr-c"><div class="wrap"><button class="bt" type="button" id="cAnt" aria-label="Anterior">‹</button><span class="n" id="cN">1 de ' + D.slides.length + '</span><button class="bt" type="button" id="cSeg" aria-label="Seguinte">›</button><button class="bt" type="button" id="cPausa" aria-label="Pausa">❚❚</button><div class="barras-c" id="cB">' + D.slides.map(function (s, i) { return '<button type="button" aria-label="Ir para ' + (i + 1) + '"><i></i></button>'; }).join('') + '</div></div></div></section>';
  h += '<div class="wrap"><div class="quatro">' + D.quatro.map(function (q) { return '<div class="q4 ' + (q.cl || '') + '">' + (q.et ? '<span class="et-al">' + ic('i-escudo', 14) + q.et + '</span>' : '') + '<h3>' + q.h + '</h3>' + (q.l[2] ? '<a class="btn" href="' + q.l[1] + '">' + q.l[0] + ' ' + ic('i-seta', 16) + '</a>' : '<a class="lk-s" href="' + q.l[1] + '">' + q.l[0] + '</a>') + '</div>'; }).join('') + '</div></div>';
  h += '<section class="hp-sec" id="quero"><div class="wrap"><p class="sobre-t">Passe das ideias à ação</p><h2 class="tit" style="margin-bottom:24px">Como podemos <b>ajudar hoje?</b></h2><div class="quero-t" id="queroT" role="tablist">' + D.quero.map(function (q, i) { return '<button type="button" role="tab" data-q="' + i + '"' + (i ? '' : ' class="on"') + '>' + ic(q.ico, 16) + q.t + '</button>'; }).join('') + '</div><div id="queroC"></div></div></section>';
  h += '<section class="hp-sec alt" id="destaques"><div class="wrap"><div class="cab-s"><div><p class="sobre-t">Em destaque</p><h2 class="tit">Os destaques <b>que importam</b></h2></div><div class="setas"><button type="button" data-d="-1" aria-label="Anterior">‹</button><button type="button" data-d="1" aria-label="Seguinte">›</button></div></div><div class="dest-c" id="destC">' +
    D.dest.map(function (d) { return '<a class="dc" id="' + d.id + '" href="' + d.l[1] + '">' + capa(d.cat, d.ico) + '<div class="tx"><h3>' + d.h + '</h3><p>' + d.p + '</p><span class="lk-s">' + d.l[0] + '</span></div></a>'; }).join('') + '</div></div></section>';
  h += '<section class="hp-sec" id="simuladores"><div class="wrap"><div class="cab-s"><div><p class="sobre-t">Simuladores</p><h2 class="tit">Faça as contas <b>antes de decidir</b></h2></div><a class="lk-s" href="/simuladores">Ver todos</a></div><div class="sim4">' +
    D.sims.map(function (s) { var href = s[0] === 'guia' ? '/artigos/tesouraria-pme-13-semanas' : '/simuladores' + (s[0] ? '#' + s[0] : '');
      return '<a class="s4" href="' + href + '"><div class="rodela"><span>' + ic(s[1], 40) + '</span></div><h3>' + s[2] + '</h3><p>' + s[3] + '</p><span class="lk-s">' + (s[0] === 'guia' ? 'Ler guia' : s[0] ? 'Simular' : 'Ver simuladores') + '</span></a>'; }).join('') + '</div></div></section>';
  h += '<section class="hp-sec alt"><div class="wrap blocos">' + D.blocos.map(function (b, i) { return '<div class="bloco-z' + (i % 2 ? ' inv' : '') + '" id="' + b.id + '"><div><p class="sobre-t">' + b.sob + '</p><h2 class="tit" style="font-size:clamp(26px,3vw,38px)">' + b.h + '</h2><p style="margin-top:16px">' + b.p + '</p><a class="lk-s" href="' + b.l[1] + '">' + b.l[0] + '</a></div><div class="vis-z">' + ARTE[b.arte] + '</div></div>'; }).join('') + '</div></section>';
  var arts = ARTIGOS.slice().sort(function (a, b) { return ((b.cat === 'empresas') === emp) - ((a.cat === 'empresas') === emp) || b.data.localeCompare(a.data); }).slice(0, 3);
  h += '<section class="hp-sec" id="artigos"><div class="wrap"><p class="sobre-t">Artigos, dicas e muito mais</p><h2 class="tit" style="margin-bottom:30px">Tudo o que precisa <b>para decidir melhor</b></h2><div class="dicas"><div class="dica-p"><div><p class="sobre-t" style="color:#e9e5ff">Artigos BXB</p><h3>Poupança, crédito, impostos e gestão, sem jargão</h3></div><a class="btn btn-s" href="/artigos" style="align-self:flex-start;border-radius:999px">Ver todos os artigos</a></div>' +
    arts.map(function (a) { var c = CATEGORIAS[a.cat] || {}; return '<a class="art" href="/artigos/' + a.id + '">' + capa(a.cat, c.ico || 'i-livro') + '<div class="tx"><span class="tagc">' + esc(c.nome) + '</span><h3>' + esc(a.titulo) + '</h3><span class="meta">' + a.min + ' min de leitura</span></div></a>'; }).join('') + '</div></div></section>';
  var s = emp ? 'e' : 'p';
  var faq = AJUDA.filter(function (x) { return x.topo && x.seg.indexOf(s) >= 0; }).concat(AJUDA.filter(function (x) { return !x.topo && x.seg.indexOf(s) >= 0; })).slice(0, 6);
  h += '<section class="hp-sec alt" id="duvidas"><div class="wrap"><div class="cab-s"><div><p class="sobre-t">Dúvidas frequentes</p><h2 class="tit">Antes de <b>começar</b></h2></div><a class="lk-s" href="/ajuda">Ir para a Ajuda</a></div><div class="faq6">' +
    faq.map(function (x) { return '<a class="fq" href="/ajuda?p=' + x.id + '">' + esc(x.q) + '</a>'; }).join('') + '</div></div></section>';
  h += '<section class="hp-sec"><div class="wrap"><p class="sobre-t">Precisa de ajuda?</p><h2 class="tit" style="margin-bottom:30px">Estamos <b>aqui para si</b></h2><div class="aj3">' +
    D.ajuda.map(function (a) { return '<div class="a3"><i>' + ic(a[0], 20) + '</i><p class="sobre-t">' + a[1] + '</p><h3>' + a[2] + '</h3><a class="lk-s" href="' + a[4] + '">' + a[3] + '</a></div>'; }).join('') + '</div></div></section>';
  document.getElementById('hp').innerHTML = h;

  // ---------- carrossel ----------
  var faixa = document.getElementById('faixaS'), car = document.getElementById('carr'), bs = document.querySelectorAll('#cB button'), n = D.slides.length, at = 0, tm = null, pausa = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DUR = 8000; car.style.setProperty('--dur', DUR + 'ms');
  function ir(i) { at = (i + n) % n; faixa.style.transform = 'translateX(' + (-100 * at) + '%)'; document.getElementById('cN').textContent = (at + 1) + ' de ' + n;
    bs.forEach(function (b, k) { b.classList.remove('on'); b.classList.toggle('feito', k < at); }); void bs[at].offsetWidth; bs[at].classList.add('on');
    faixa.querySelectorAll('.slide').forEach(function (sl, k) { sl.setAttribute('aria-hidden', k !== at); sl.querySelectorAll('a').forEach(function (a) { a.tabIndex = k === at ? 0 : -1; }); });
    clearTimeout(tm); if (!pausa) tm = setTimeout(function () { ir(at + 1); }, DUR); }
  document.getElementById('cAnt').onclick = function () { ir(at - 1); };
  document.getElementById('cSeg').onclick = function () { ir(at + 1); };
  bs.forEach(function (b, k) { b.onclick = function () { ir(k); }; });
  var bP = document.getElementById('cPausa');
  function marcarPausa() { car.classList.toggle('pausa', pausa); bP.textContent = pausa ? '▶' : '❚❚'; bP.setAttribute('aria-label', pausa ? 'Continuar' : 'Pausa'); }
  bP.onclick = function () { pausa = !pausa; marcarPausa(); ir(at); };
  car.addEventListener('mouseenter', function () { if (!pausa) { clearTimeout(tm); car.classList.add('pausa'); } });
  car.addEventListener('mouseleave', function () { if (!pausa) { car.classList.remove('pausa'); ir(at); } });
  var x0 = null; car.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  car.addEventListener('touchend', function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) ir(at + (dx < 0 ? 1 : -1)); x0 = null; });
  marcarPausa(); ir(0);

  // ---------- como podemos ajudar hoje? ----------
  var QC = document.getElementById('queroC');
  function quero(i) { var q = D.quero[i];
    document.querySelectorAll('#queroT button').forEach(function (b) { b.classList.toggle('on', +b.dataset.q === i); });
    var fmt = q.fmt || function (v) { return v.toLocaleString('pt-PT') + ' €'; };
    var dir = q.vals ? '<div class="vals">' + q.vals.map(function (v) { return '<button type="button" data-v="' + v + '"' + (v === q.def ? ' class="on"' : '') + '>' + fmt(v) + '</button>'; }).join('') + '<input class="outro" type="number" min="1" inputmode="decimal" placeholder="Outro valor' + (q.un === '%' ? ' (%)' : ' (€)') + '" aria-label="Outro valor"><div class="res" id="qRes"></div><div class="acao"><a class="btn btn-p" href="' + q.cta[1] + '">' + q.cta[0] + ' ' + ic('i-seta', 16) + '</a></div></div>'
      : '<div class="lado">' + q.lado.map(function (l) { return '<a class="li" href="' + l[1] + '">' + l[0] + '</a>'; }).join('') + '</div>';
    QC.innerHTML = '<div class="camp"><div><span class="tg">' + ic('i-ok', 13) + q.tg + '</span><span class="lb">' + q.lb + '</span><h3>' + q.h + '</h3><ul>' + q.pts.map(function (t) { return '<li>' + ok + t + '</li>'; }).join('') + '</ul></div>' + dir + '</div>';
    if (q.vals) { var res = document.getElementById('qRes'), mostrar = function (v) { res.innerHTML = q.res(v); };
      QC.querySelectorAll('[data-v]').forEach(function (b) { b.onclick = function () { QC.querySelectorAll('[data-v]').forEach(function (x) { x.classList.toggle('on', x === b); }); QC.querySelector('.outro').value = ''; mostrar(+b.dataset.v); }; });
      QC.querySelector('.outro').oninput = function () { var v = parseFloat(this.value); if (!(v > 0) || (q.un === '%' && v >= 100)) return; QC.querySelectorAll('[data-v]').forEach(function (x) { x.classList.remove('on'); }); mostrar(v); };
      mostrar(q.def); }
  }
  document.getElementById('queroT').onclick = function (e) { var b = e.target.closest('[data-q]'); if (b) quero(+b.dataset.q); };
  quero(0);

  // ---------- destaques: setas ----------
  var dc = document.getElementById('destC');
  document.querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { var w = dc.querySelector('.dc').offsetWidth + 20; dc.scrollBy({ left: +b.dataset.d * w, behavior: 'smooth' }); }; });

  if (location.hash) { var alvo = document.getElementById(location.hash.slice(1)); if (alvo) setTimeout(function () { alvo.scrollIntoView(); }, 80); }
})();
</script>
