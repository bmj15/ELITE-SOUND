<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="/SISTEMAS/manifest.json">
<link rel="icon" type="image/png" href="/SISTEMAS/icones/favicon-32.png">
<link rel="apple-touch-icon" href="/SISTEMAS/icones/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BXB">
<title>As minhas áreas · BXB</title>
<script src="shared/servidor-dados.js?v=8"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/spap.css?v=50">
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(60% 50% at 20% 20%,rgba(139,92,246,.18),transparent 60%),radial-gradient(60% 50% at 80% 80%,rgba(201,162,39,.16),transparent 60%),var(--bg)}
  .wrap{width:min(980px,100%)}
  h1{font-size:40px;letter-spacing:-1.4px;margin:0 0 6px}
  .sys{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
  .sys a{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:28px;border-radius:22px;border:1px solid var(--line2);background:var(--panel);text-decoration:none;transition:transform .2s,border-color .2s;min-height:260px}
  .sys a:hover{transform:translateY(-4px);border-color:var(--c1)}
  .logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--ink)}
  .sys h2{margin:0;font-size:24px;letter-spacing:-.5px}
  .sys p{margin:0;color:var(--muted)}
  .sys ul{margin:auto 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
  .sys li{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--panel3);color:var(--muted)}
  @media(max-width:760px){.sys{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="muted" id="sup" style="letter-spacing:.14em;font-size:12px;text-transform:uppercase"></div>
  <h1 id="tit">Olá</h1>
  <div class="sys" id="sys"></div>
  <div id="criar"></div>
</div>
<script src="shared/grupo.js?v=7"></script>
<script>
(function () {
  // a área de cada conta: particular entra sempre direto na sua área pessoal; empresa escolhe só se tiver várias
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ses = (window.BXBServidor || {}).sessao; if (!ses) return;
  var trocar = /trocar=1/.test(location.search), tipo = null; try { tipo = sessionStorage.getItem('bxb:tipo'); } catch (e) { }
  var areas = ses.proprios || [];
  if (trocar) tipo = null; else if (!tipo) tipo = areas.some(function (a) { return a.tipo === 'particular'; }) ? 'particular' : 'empresa';
  var minhas = areas.filter(function (a) { return !tipo || a.tipo === tipo; });
  if (!trocar && minhas.length && (tipo === 'particular' || minhas.length === 1)) { location.replace(Grupo.href(minhas[0], '')); return; }
  var post = function (url, corpo) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-BXB': '1' }, body: JSON.stringify(corpo || {}) }).then(function (r) { return r.json(); }); };
  document.getElementById('sup').textContent = trocar ? 'As minhas áreas' : tipo === 'empresa' ? 'Empresas' : 'Particulares';
  document.getElementById('tit').textContent = 'Olá, ' + String(ses.nome || '').split(' ')[0];
  document.getElementById('sys').innerHTML = minhas.map(function (s) {
    var m = Grupo.MODELOS[s.modelo] || { nome: s.modelo, desc: '' };
    return '<a href="' + Grupo.href(s, '') + '" style="--c1:' + esc(s.cor1) + ';--c2:' + esc(s.cor2) + ';--ink:#fff">' +
      '<div class="logo">' + esc(s.sigla) + '</div><div><h2>' + esc(s.nome) + '</h2><p>' + esc(s.setor || m.desc) + '</p></div>' +
      '<ul><li>' + (s.tipo === 'empresa' ? 'Empresa' : 'Particular') + '</li><li>' + (s.papel === 'dono' ? 'Responsável' : 'Colaborador') + '</li></ul></a>';
  }).join('');
  var cr = document.getElementById('criar');
  if (tipo === 'particular' && !minhas.length) {
    cr.innerHTML = '<div class="card" style="margin-top:24px;max-width:560px"><h3 style="margin:0 0 8px">Ainda não tem a sua área pessoal</h3><p class="muted" style="margin:0 0 16px">Abra já o seu plano pessoal.</p><button class="btn primary" id="cp">Abrir a minha área pessoal</button> <span class="muted" id="ce"></span></div>';
    document.getElementById('cp').onclick = function () { this.disabled = true; post('/api/criar-area', { tipo: 'particular' }).then(function (j) { if (j.destino) location.replace(j.destino); else document.getElementById('ce').textContent = j.erro || 'Erro'; }); };
  } else if (tipo === 'empresa' || trocar) {
    cr.innerHTML = '<div class="card" style="margin-top:24px;max-width:560px"><h3 style="margin:0 0 8px">' + (minhas.length ? 'Abrir outra empresa' : 'Ainda não tem nenhuma empresa nesta conta') + '</h3>' +
      '<p class="muted" style="margin:0 0 14px">Se trabalha numa empresa que já usa o site, peça ao responsável para o convidar com o seu email.</p>' +
      '<form id="fe" class="form"><div class="fld"><label>Nome da empresa</label><input class="inp" name="empresa" required></div><div class="fld"><label>NIF (opcional)</label><input class="inp" name="nif" inputmode="numeric" maxlength="9"></div>' +
      '<div class="fld full"><button class="btn primary" type="submit">Criar empresa</button> <span class="muted" id="ce"></span></div></form></div>';
    document.getElementById('fe').onsubmit = function (e) { e.preventDefault(); var f = Object.fromEntries(new FormData(e.target));
      post('/api/criar-area', { tipo: 'empresa', empresa: f.empresa, nif: f.nif }).then(function (j) { if (j.destino) location.replace(j.destino); else document.getElementById('ce').textContent = j.erro || 'Erro'; }); };
  }
})();
</script>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('spap:theme')||'dark')}catch(e){}</script>
</body>
</html>
