<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Os meus sistemas · BXB</title>
<script src="shared/servidor-dados.js?v=5"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/spap.css?v=29">
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(60% 50% at 20% 20%,rgba(139,92,246,.18),transparent 60%),radial-gradient(60% 50% at 80% 80%,rgba(201,162,39,.16),transparent 60%),var(--bg)}
  .wrap{width:min(980px,100%)}
  h1{font-size:40px;letter-spacing:-1.4px;margin:0 0 6px}
  .sys{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
  .sys a{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:28px;border-radius:22px;border:1px solid var(--line2);background:var(--panel);text-decoration:none;transition:transform .2s,border-color .2s;min-height:260px}
  .sys a:hover{transform:translateY(-4px);border-color:var(--c1)}
  .logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--ink)}
  .sys h2{margin:0;font-size:24px;letter-spacing:-.5px}
  .sys p{margin:0;color:var(--muted)}
  .sys ul{margin:auto 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
  .sys li{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--panel3);color:var(--muted)}
  @media(max-width:760px){.sys{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="muted" id="sup" style="letter-spacing:.14em;font-size:12px;text-transform:uppercase">Os meus sistemas</div>
  <h1 id="tit">Olá</h1>
  <div class="sys" id="sys"></div>
  <p class="muted" id="vazio" style="display:none">Esta conta ainda não tem nenhum sistema deste tipo. <a href="entrar.html">Voltar à entrada</a></p>
</div>
<script src="shared/grupo.js?v=6"></script>
<script>
(function () {
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pode = function (k) { return !window.BXBServidor || !BXBServidor.podeVer || BXBServidor.podeVer(k); };
  var ses = (window.BXBServidor || {}).sessao || {};
  // o separador escolhido na entrada (Particulares / Empresas) decide o que aparece; com um só sistema entra logo nele
  var tipo = null; try { tipo = sessionStorage.getItem('bxb:tipo'); } catch (e) { }
  tipo = ses.tipo || tipo || 'particular';
  var eTipo = function (s) { return (s.tipo || (s.modelo === 'planeamento' ? 'particular' : 'empresa')) === tipo; };
  var meus = Grupo.lista().filter(function (s) { return s.ativa !== false && pode(s.key) && eTipo(s); });
  if (meus.length === 1) { location.replace(Grupo.href(meus[0], '')); return; }
  document.getElementById('sup').textContent = tipo === 'empresa' ? 'Empresas' : 'Particulares';
  document.getElementById('tit').textContent = 'Olá' + (ses.nome ? ', ' + String(ses.nome).split(' ')[0] : '');
  if (!meus.length) document.getElementById('vazio').style.display = '';
  document.getElementById('sys').innerHTML = meus.map(function (s) {
    var m = Grupo.MODELOS[s.modelo] || { nome: s.modelo, desc: '' };
    return '<a href="' + Grupo.href(s, '') + '" style="--c1:' + esc(s.cor1) + ';--c2:' + esc(s.cor2) + ';--ink:#fff">' +
      '<div class="logo">' + esc(s.sigla) + '</div><div><h2>' + esc(s.nome) + '</h2><p>' + esc(s.setor || m.desc) + '</p></div>' +
      '<ul><li>' + (tipo === 'empresa' ? 'Empresa' : 'Particular') + '</li><li>' + esc(m.nome) + '</li></ul></a>';
  }).join('');
})();
</script>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('spap:theme')||'dark')}catch(e){}</script>
</body>
</html>
