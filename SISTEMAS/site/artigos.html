<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artigos · BXB</title>
<meta name="description" content="Artigos sobre poupança, crédito, impostos e gestão de empresas, escritos para decidir melhor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/SISTEMAS/site/pais.js?v=2"></script>
<link rel="stylesheet" href="/SISTEMAS/site/site.css?v=18">
</head>
<body data-pagina="artigos">
<main>
  <section class="cab-artigos heroi" style="padding-bottom:0">
    <div class="wrap">
      <div>
        <span class="eyebrow"><i></i>Artigos BXB</span>
        <h1>Saber mais para <span class="grad-t">decidir melhor</span></h1>
        <p>Poupança, crédito, impostos e gestão de empresas, explicados sem jargão e com exemplos.</p>
      </div>
    </div>
  </section>
  <section style="padding-top:20px">
    <div class="wrap">
      <div id="dest"></div>
      <div class="filtros" id="filtros"></div>
      <div class="arts" id="lista"></div>
    </div>
  </section>
  <div class="wrap">
    <div class="final rv">
      <h2>Da ideia <span class="grad-t">ao plano</span></h2>
      <p>Ponha estas ideias em prática com as suas contas reais. Abrir conta demora um minuto.</p>
      <div class="ctas"><a class="btn btn-p" href="/SISTEMAS/entrar.html?criar=1" data-abr>Abrir conta</a><a class="btn btn-s" href="/SISTEMAS/entrar.html" data-ent>Entrar</a></div>
    </div>
  </div>
</main>
<script src="/SISTEMAS/site/artigos.js?v=7"></script>
<script src="/SISTEMAS/site/site.js?v=8"></script>
<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (x) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]; }); };
  var meses = ['jan.', 'fev.', 'mar.', 'abr.', 'mai.', 'jun.', 'jul.', 'ago.', 'set.', 'out.', 'nov.', 'dez.'];
  var data = function (d) { var p = d.split('-'); return +p[2] + ' ' + meses[+p[1] - 1] + ' ' + p[0]; };
  var lista = ARTIGOS.slice().sort(function (a, b) { return b.data.localeCompare(a.data); });
  var capa = function (a, s, ja) { return capaArtigo(a, s, ja); };
  var cartao = function (a) { return '<a class="art rv" href="/artigos/' + a.id + '">' + capa(a) + '<div class="tx"><span class="tagc">' + esc((CATEGORIAS[a.cat] || {}).nome) + '</span><h3>' + esc(a.titulo) + '</h3><p>' + esc(a.resumo) + '</p><span class="meta">' + data(a.data) + ' · ' + a.min + ' min de leitura</span></div></a>'; };
  var dest = lista.find(function (a) { return a.destaque; }) || lista[0];
  var cat = new URLSearchParams(location.search).get('c') || '';
  document.getElementById('filtros').innerHTML = [['', 'Todos']].concat(Object.keys(CATEGORIAS).filter(function (k) { return lista.some(function (a) { return a.cat === k; }); }).map(function (k) { return [k, CATEGORIAS[k].nome]; }))
    .map(function (x) { return '<button data-c="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join('');
  function pintar() {
    document.querySelectorAll('[data-c]').forEach(function (b) { b.classList.toggle('on', b.dataset.c === cat); });
    var d = document.getElementById('dest');
    d.innerHTML = cat ? '' : '<a class="destaque rv" href="/artigos/' + dest.id + '">' + capa(dest, '(max-width:860px) 92vw, 55vw', true) + '<div class="tx"><span class="tagc">Em destaque · ' + esc(CATEGORIAS[dest.cat].nome) + '</span><h2>' + esc(dest.titulo) + '</h2><p>' + esc(dest.resumo) + '</p><span class="btn btn-s">Ler artigo · ' + dest.min + ' min</span></div></a>';
    document.getElementById('lista').innerHTML = lista.filter(function (a) { return cat ? a.cat === cat : a !== dest; }).map(cartao).join('');
    Site.revelar();
  }
  document.getElementById('filtros').onclick = function (e) { var b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c;
    history.replaceState(null, '', cat ? '?c=' + cat : location.pathname); pintar(); };
  pintar();
})();
</script>
</body>
</html>
