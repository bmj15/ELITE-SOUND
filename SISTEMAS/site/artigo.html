<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artigo · BXB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/SISTEMAS/site/pais.js?v=2"></script>
<link rel="stylesheet" href="/SISTEMAS/site/site.css?v=15">
</head>
<body data-pagina="artigos">
<div class="progresso" id="prog"></div>
<main>
  <article class="wrap"><div class="leitura" id="art"></div></article>
  <section style="padding-top:60px"><div class="wrap"><div class="sec-h" style="margin-bottom:30px"><h2 style="font-size:32px">Continue a ler</h2></div><div class="arts" id="rel"></div></div></section>
</main>
<script src="/SISTEMAS/site/artigos.js?v=7"></script>
<script src="/SISTEMAS/site/site.js?v=7"></script>
<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (x) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]; }); };
  var meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var data = function (d) { var p = d.split('-'); return +p[2] + ' de ' + meses[+p[1] - 1] + ' de ' + p[0]; };
  var id = decodeURIComponent((window.BXB_CAMINHO || location.pathname).replace(/^\/artigos\/?/, '').replace(/\/$/, '')) || new URLSearchParams(location.search).get('a');
  id = ({ 'avalanche-ou-bola-de-neve': 'por-qual-divida-comecar' })[id] || id;
  var a = ARTIGOS.find(function (x) { return x.id === id; }), box = document.getElementById('art');
  var outro = !a && (window.ARTIGOS_TODOS || []).find(function (x) { return x.id === id && x.par; });
  if (outro) return location.replace((window.BXB_PAIS ? '/pt-' + BXB_PAIS : '') + '/artigos/' + outro.par);
  if (!a) { box.innerHTML = '<div class="topo-art"><h1>Artigo não encontrado</h1><p class="resumo">Pode ter mudado de endereço.</p><a class="btn btn-p" href="/artigos">Ver todos os artigos</a></div>'; document.getElementById('rel').parentNode.parentNode.remove(); return; }
  var c = CATEGORIAS[a.cat] || {};
  document.title = a.titulo + ' · BXB';
  var md = document.createElement('meta'); md.name = 'description'; md.content = a.resumo; document.head.appendChild(md);
  box.innerHTML = '<div class="topo-art"><a class="voltar-art" href="/artigos?c=' + a.cat + '">‹ ' + esc(c.nome) + '</a>' +
    '<h1>' + esc(a.titulo) + '</h1><p class="resumo">' + esc(a.resumo) + '</p>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span class="meta">' + data(a.data) + ' · ' + a.min + ' min de leitura</span>' +
    '<div class="partilhar"><span>Partilhar</span><button id="copiar">Copiar ligação</button></div></div></div>' +
    capaArtigo(a, '(max-width:900px) 94vw, 900px', true) +
    '<div class="corpo">' + a.corpo + '</div>' +
    '<p class="aviso-leg">Este artigo tem fins informativos e não constitui aconselhamento financeiro, fiscal ou jurídico personalizado. Regras, taxas e limites podem mudar: confirme sempre junto das entidades oficiais (Portal das Finanças, Segurança Social, Banco de Portugal) ou de um profissional.</p>' +
    '<div class="cta-art"><div><b>Ponha isto em prática</b><span>Abra a sua conta e veja os seus números reais.</span></div><a class="btn btn-p" href="/SISTEMAS/entrar.html?criar=1&tipo=' + (a.cat === 'empresas' ? 'empresa' : 'particular') + '" data-abr>Abrir conta</a></div>';
  document.getElementById('copiar').onclick = function () { var b = this; (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.reject()).then(function () { b.textContent = 'Copiada'; }, function () { b.textContent = location.href; }); };
  var rel = ARTIGOS.filter(function (x) { return x.id !== a.id; }).sort(function (x, y) { return (y.cat === a.cat) - (x.cat === a.cat) || y.data.localeCompare(x.data); }).slice(0, 3);
  document.getElementById('rel').innerHTML = rel.map(function (x) { var cx = CATEGORIAS[x.cat] || {};
    return '<a class="art rv" href="/artigos/' + x.id + '">' + capaArtigo(x) + '<div class="tx"><span class="tagc">' + esc(cx.nome) + '</span><h3>' + esc(x.titulo) + '</h3><p>' + esc(x.resumo) + '</p><span class="meta">' + x.min + ' min de leitura</span></div></a>'; }).join('');
  Site.revelar();
  var prog = document.getElementById('prog');
  addEventListener('scroll', function () { var h = box.offsetTop + box.offsetHeight - innerHeight; prog.style.width = Math.min(100, Math.max(0, (scrollY - box.offsetTop + 80) / Math.max(1, h - box.offsetTop) * 100)) + '%'; }, { passive: true });
})();
</script>
</body>
</html>
