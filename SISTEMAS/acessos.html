<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="/SISTEMAS/manifest.json">
<link rel="icon" type="image/png" href="/SISTEMAS/icones/favicon-32.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Administração · dinmeta</title>
<script src="shared/servidor-dados.js?v=8"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/spap.css?v=50">
<style>
  body{min-height:100vh;margin:0;background:var(--bg)}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
  .topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .topo a{color:#a78bfa;text-decoration:none;font-weight:600}
  h1{font-size:30px;letter-spacing:-1px;margin:0 0 4px}
</style>

<link rel="stylesheet" href="/SISTEMAS/shared/marca.css?v=1">
<script src="/SISTEMAS/shared/marca.js?v=2"></script>
<link rel="icon" type="image/svg+xml" href="/SISTEMAS/icones/dinmeta-favicon.svg">
<meta name="application-name" content="dinmeta">
<meta name="author" content="BXB">
</head>
<body>
<div class="wrap">
  <a class="dinmeta-identidade dinmeta-marca-pagina" href="/SISTEMAS/index.html"><svg class="dinmeta-simbolo" viewBox="0 0 224 180" fill="none" aria-hidden="true" focusable="false"><use href="/SISTEMAS/icones/dinmeta.svg#dinmeta-simbolo"></use></svg><span class="dinmeta-palavra">dinmeta</span></a>
  <div class="topo"><a href="/SISTEMAS/index.html">‹ Voltar</a></div>
  <h1>Administração</h1>
  <p class="muted" style="margin:0 0 18px">Gestão de contas: ativar, desativar, corrigir o email e repor a palavra-passe. O administrador não tem acesso aos dados de nenhum cliente.</p>
  <div id="c"></div>
  <footer class="dinmeta-credito dinmeta-rodape">Desenvolvido pela BXB</footer>
</div>
<script>
(function () {
  'use strict';
  var S = window.BXBServidor || {}, c = document.getElementById('c');
  if (!S.sessao) { location.replace('/SISTEMAS/entrar.html?voltar=' + encodeURIComponent('/SISTEMAS/acessos.html')); return; }
  if (!S.sessao.admin) { c.innerHTML = '<div class="alert bad"><div>Só administradores.</div></div>'; return; }
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (x) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]; }); };
  var api = function (m, url, corpo) { return fetch(url, { method: m, headers: { 'Content-Type': 'application/json', 'X-BXB': '1' }, body: corpo ? JSON.stringify(corpo) : undefined }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); }); };
  var tipos = function (ar) { var p = ar.filter(function (a) { return a.tipo === 'particular'; }).length, e = ar.filter(function (a) { return a.tipo === 'empresa'; }).length;
    return [p ? 'Particular' : '', e ? e + ' empresa' + (e > 1 ? 's' : '') : ''].filter(Boolean).map(function (t) { return '<span class="badge plain" style="margin:2px">' + t + '</span>'; }).join('') || '<span class="faint">sem área</span>'; };
  function carregar() {
    api('GET', '/api/contas').then(function (r) {
      if (!r.ok) { c.innerHTML = '<div class="alert bad"><div>' + esc(r.j.erro) + '</div></div>'; return; }
      c.innerHTML = '<div class="card flush"><div class="card-h"><h3>Contas</h3><span class="faint">' + r.j.length + '</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nome</th><th>Email</th><th>Áreas</th><th>Estado</th><th></th></tr></thead><tbody>' +
        r.j.map(function (x) { return '<tr><td><b>' + esc(x.nome) + '</b>' + (x.admin ? ' <span class="badge acc">admin</span>' : '') + '<div class="faint">desde ' + esc(String(x.criada_em).slice(0, 10)) + '</div></td>' +
          '<td class="mono">' + esc(x.email || x.utilizador || '—') + '</td><td>' + tipos(x.areas) + '</td><td>' + (x.ativo ? '<span class="badge ok">ativa</span>' : '<span class="badge bad">desativada</span>') + '</td>' +
          '<td class="r" style="white-space:nowrap"><button class="btn sm" data-ed="' + x.id + '">Editar</button></td></tr>'; }).join('') + '</tbody></table></div></div><div id="form"></div>';
      c.querySelectorAll('[data-ed]').forEach(function (b) { b.onclick = function () { form(r.j.find(function (x) { return x.id === b.dataset.ed; })); }; });
    });
  }
  function form(x) {
    var f = document.getElementById('form'), eu = x.id === S.sessao.id;
    f.innerHTML = '<div class="card" style="margin-top:16px"><div class="card-h"><h3>' + esc(x.nome) + '</h3></div><form class="form" id="fc">' +
      '<div class="fld"><label>Nome</label><input class="inp" name="nome" value="' + esc(x.nome) + '"></div>' +
      '<div class="fld"><label>Email (entrada no site)</label><input class="inp mono" type="email" name="email" value="' + esc(x.email || '') + '"></div>' +
      '<div class="fld"><label>Nova palavra-passe (deixe vazio para manter)</label><input class="inp" type="password" name="palavra" autocomplete="new-password"><span class="hint">Para quem se esqueceu: diga-lhe a palavra-passe temporária e peça-lhe para a mudar em A minha conta.</span></div>' +
      '<div class="fld"><label>&nbsp;</label><label class="check"><input type="checkbox" name="ativo" ' + (x.ativo ? 'checked' : '') + (eu ? ' disabled' : '') + '> Conta ativa</label>' +
      '<label class="check"><input type="checkbox" name="admin" ' + (x.admin ? 'checked' : '') + (eu ? ' disabled' : '') + '> Administrador (gestão de contas)</label></div>' +
      '<div class="fld full"><button class="btn primary" type="submit">Guardar</button> <button class="btn ghost" type="button" id="cx">Cancelar</button> <span id="em"></span></div></form></div>';
    document.getElementById('cx').onclick = function () { f.innerHTML = ''; };
    document.getElementById('fc').onsubmit = function (e) { e.preventDefault(); var d = Object.fromEntries(new FormData(e.target));
      var corpo = { id: x.id, nome: d.nome, email: d.email, palavra: d.palavra || undefined };
      if (!eu) { corpo.ativo = !!e.target.ativo.checked; corpo.admin = !!e.target.admin.checked; }
      api('POST', '/api/contas', corpo).then(function (r) { if (!r.ok) { document.getElementById('em').textContent = r.j.erro; return; } carregar(); }); };
  }
  carregar();
})();
</script>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('spap:theme')||'dark')}catch(e){}</script>
</body>
</html>
